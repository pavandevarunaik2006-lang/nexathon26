version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: roadalert_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadalert
      POSTGRES_PASSWORD: roadalert_dev_password
      POSTGRES_DB: roadalert_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadalert -d roadalert_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
